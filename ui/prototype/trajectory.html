<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH 执行记录</title>
<style>
/* Design tokens from @deepseek-ai/dsh-client-ui-theme (0.2.1-rc.2, MIT):
   alias surfaces/labels/state colors, radius and type scales. Light values
   from the default theme, dark values from the dark theme mapping. */
:root{
  color-scheme:light;
  --layer-1:#fff;--layer-2:#fff;--layer-3:#fff;
  --module-platform:#f5f6f7;--ghost-active:#ebeef2;
  --border-l4:#00000029;
  --label-1:#0f1115;--label-2:#61666b;--label-3:#81858c;
  --success:#22c55e;--success-bg:#e6faed;
  --warn:#dd8629;--warn-bg:#fef5e7;
  --error:#ec1313;--error-2:#f25a5a;
  --brand:#5686fe;
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  --f-xs:13px/20px var(--font);--f-xs-strong:500 13px/20px var(--font);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --layer-1:#232324;--layer-2:#2c2c2e;--layer-3:#353638;
  --module-platform:#353638;--ghost-active:#43454a;
  --border-l4:#ffffff33;
  --label-1:#f9fafb;--label-2:#cfd3d6;--label-3:#adb2b8;
  --success-bg:#233c2c;
  --warn-bg:#27241f;
  --error:#f25a5a;
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --layer-1:#232324;--layer-2:#2c2c2e;--layer-3:#353638;
  --module-platform:#353638;--ghost-active:#43454a;
  --border-l4:#ffffff33;
  --label-1:#f9fafb;--label-2:#cfd3d6;--label-3:#adb2b8;
  --success-bg:#233c2c;
  --warn-bg:#27241f;
  --error:#f25a5a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--layer-1);color:var(--label-1);font:var(--f-xs)}
header{max-width:880px;margin:0 auto;padding:16px 16px 4px}
h1{font:600 15px/22px var(--font);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar{display:flex;gap:8px;align-items:center;max-width:880px;margin:0 auto;padding:8px 16px 8px}
button,select{font:var(--f-xs);color:var(--label-1);background:var(--layer-2);border:0.5px solid var(--border-l4);border-radius:var(--radius-sm);padding:5px 12px;cursor:pointer}
button:hover{background:var(--ghost-active)}
button:disabled{cursor:default;opacity:.4}
button:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
#stage{padding:0 16px 20px}
#panel{position:relative;max-width:880px;margin:0 auto}
#ledger{height:calc(100vh - 118px);min-height:320px;overflow-y:auto;border:0.5px solid var(--border-l4);border-radius:var(--radius-md);background:var(--layer-2);overscroll-behavior:contain}
#ledger ul{list-style:none;margin:0;padding:0}
/* Sticky turn bar: ghost-active fill, centered content lane. */
.turn-head{position:sticky;top:0;z-index:1;height:44px;background:var(--ghost-active)}
.turn-inner{display:flex;align-items:center;justify-content:space-between;height:100%;max-width:848px;margin:0 auto;padding:0 16px}
.turn-title{font:var(--f-xs-strong)}
.turn-reason{font:var(--f-xs);color:var(--label-2)}
.records{padding:8px 16px 12px}
/* 38px step cell: index · kind tag · text · time. */
.record details{border-radius:var(--radius-md);border:0.5px solid var(--border-l4);background:var(--layer-3);margin-bottom:6px}
.record summary{list-style:none;display:flex;align-items:center;height:38px;padding:0 8px 0 12px;gap:16px;cursor:pointer;min-width:0}
.record summary::-webkit-details-marker{display:none}
.record summary:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:var(--radius-md)}
.idx{flex:none;width:28px;color:var(--label-3);font:var(--f-xs)}
.tag{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-xs);font:var(--f-xs-strong);white-space:nowrap}
.tagUser{color:var(--success);background:var(--success-bg)}
.tagContext{color:color-mix(in srgb,var(--success) 68%,var(--label-2));background:var(--success-bg)}
.tagMessage{color:color-mix(in srgb,var(--brand) 72%,var(--label-1));background:color-mix(in srgb,var(--brand) 14%,var(--layer-3))}
.tagTool{color:var(--warn);background:var(--warn-bg)}
.tagError{color:var(--error);background:color-mix(in srgb,var(--error-2) 12%,var(--layer-3))}
.cell-text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:var(--f-xs);color:var(--label-1)}
.trailing{flex:none;margin-left:auto;display:flex;align-items:center}
.time{width:64px;font:var(--f-xs);color:var(--label-3);white-space:nowrap}
/* Expanded detail under the collapsed row. */
.detail{padding:2px 12px 10px 56px}
.detail pre{margin:6px 0 0;padding:8px 10px;border-radius:var(--radius-sm);background:var(--module-platform);font:12px/18px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto;color:var(--label-1)}
.record[data-state=error] .detail pre,.record[data-state=interrupted] .detail pre{background:color-mix(in srgb,var(--error-2) 8%,var(--layer-3))}
.prose{margin:6px 0 0;padding:2px 2px 0;font:var(--f-xs);color:var(--label-1);white-space:pre-wrap;overflow-wrap:anywhere}
.truncated-note{margin-top:4px;font:var(--f-xs);color:var(--label-3)}
#follow{position:absolute;right:20px;bottom:20px;z-index:2;border-radius:20px;padding:6px 14px;box-shadow:0 4px 16px #0003}
#empty{padding:32px 20px;color:var(--label-3)}
.hidden{display:none!important}
@media (max-width:480px){.records{padding:6px 8px 10px}.record summary{gap:8px;padding-left:8px}.idx{display:none}.detail{padding-left:12px}.time{width:auto}}
</style>
</head>
<body>
<header><h1 id="title">DSH 执行记录</h1></header>
<nav class="toolbar">
  <select id="fixture" aria-label="选择执行记录">
    <option value="demo-1792663550562.json">演示任务（含命令失败与恢复）</option>
    <option value="ui-check-1792664983899.json">界面小测试（读→写→校验）</option>
    <option value="stress-long.json">长结果记录</option>
  </select>
  <button id="replay" type="button">逐步回放</button>
</nav>
<div id="stage"><div id="panel">
  <div id="ledger" aria-label="执行记录">
    <p id="empty">正在载入记录…</p>
  </div>
  <button id="follow" class="hidden" type="button">回到最新</button>
</div></div>
<script type="module">
import { mountLedger } from './trajectory.mjs';
const forced = new URLSearchParams(location.search).get('theme');
if (forced === 'light' || forced === 'dark') document.documentElement.dataset.theme = forced;
const $ = id => document.getElementById(id);
let all = [];
const ledger = mountLedger($('ledger'), { followButton: $('follow') });
async function load(name) {
  const fixture = await (await fetch(`./fixture/${name}`)).json();
  all = fixture.events;
  $('title').textContent = fixture.label;
  $('empty')?.remove();
  ledger.render(all);
}
let replaying = false;
$('replay').addEventListener('click', async () => {
  if (replaying) return;
  replaying = true;
  $('replay').disabled = true;
  for (let shown = 1; shown <= all.length; shown++) {
    ledger.render(all.slice(0, shown));
    await new Promise(resolve => setTimeout(resolve, 220));
  }
  replaying = false;
  $('replay').disabled = false;
});
$('fixture').addEventListener('change', () => load($('fixture').value));
await load($('fixture').value);
</script>
</body>
</html>
