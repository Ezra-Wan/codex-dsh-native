<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH 执行记录</title>
<style>
/* Tokens from @deepseek-ai/dsh-client-ui-theme (0.2.1-rc.2, MIT); chat-form
   geometry from packages/client/ui-chat MessageItem/TurnProcessNodeView. */
:root{
  color-scheme:light;
  --base:#fff;--platform:#f5f6f7;--bubble:#edf3fe;
  --hairline:#0000001a;--hover:#2631480f;
  --label-1:#0f1115;--label-2:#61666b;--label-3:#81858c;
  --error:#ec1313;--error-2:#f25a5a;--brand:#5686fe;
  --radius-sm:8px;--radius-xl:20px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --base:#151517;--platform:#353638;--bubble:#2c2c2e;
  --hairline:#ffffff1f;--hover:#ffffff14;
  --label-1:#f9fafb;--label-2:#cfd3d6;--label-3:#adb2b8;
  --error:#f25a5a;
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --base:#151517;--platform:#353638;--bubble:#2c2c2e;
  --hairline:#ffffff1f;--hover:#ffffff14;
  --label-1:#f9fafb;--label-2:#cfd3d6;--label-3:#adb2b8;
  --error:#f25a5a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--label-1);font:14px/22px var(--font)}
header{max-width:760px;margin:0 auto;padding:18px 16px 2px}
h1{font:600 15px/22px var(--font);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar{display:flex;gap:8px;align-items:center;max-width:760px;margin:0 auto;padding:10px 16px 6px}
button,select{font:13px/20px var(--font);color:var(--label-2);background:none;border:none;border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover,select:hover{background:var(--hover);color:var(--label-1)}
button:disabled{cursor:default;opacity:.4}
button:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
#stage{padding:0 16px 24px}
#panel{position:relative;max-width:760px;margin:0 auto}
#ledger{height:calc(100vh - 110px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;border-radius:12px}
#ledger ul{list-style:none;margin:0;padding:0}
.turn{padding-bottom:6px}
/* User message: right-aligned bubble (MessageItem .bubble). */
.user-stack{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding:6px 0}
.bubble{max-width:min(70%,525px);background:var(--bubble);border-radius:var(--radius-xl);padding:10px 16px;white-space:pre-wrap;word-break:break-word}
/* Collapsible turn status line (已完成，用时 …). */
.status-line{display:flex;align-items:center;height:33px;color:var(--label-3);cursor:pointer;list-style:none;transition:color 100ms ease}
.status-line::-webkit-details-marker{display:none}
.status-line:hover{color:var(--label-2);background:var(--hover);border-radius:8px}
.status-line:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.chevron{flex:none;width:14px;height:14px;margin-right:6px;position:relative;transition:transform 100ms ease}
.chevron::after{content:"";position:absolute;left:4px;top:4px;width:5px;height:5px;border-right:1.4px solid currentColor;border-bottom:1.4px solid currentColor;transform:rotate(45deg)}
details[open] > .status-line .chevron,details[open] > summary .chevron{transform:rotate(180deg)}
/* Compact process rows: hairline separated, no card. */
.process-list{padding-bottom:2px}
.process-row{border-bottom:0.5px solid var(--hairline)}
.process-row:last-child{border-bottom:none}
.process-head{display:flex;align-items:center;min-height:25px;padding:0 4px;gap:2px;color:var(--label-3);cursor:pointer;list-style:none;transition:color 100ms ease}
.process-head::-webkit-details-marker{display:none}
.process-head:hover{color:var(--label-2);background:var(--hover);border-radius:8px}
.process-head:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-radius:8px}
.process-label{flex:none}
.process-summary{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px}
.process-summary::before{content:"·";margin-right:6px;color:var(--label-3)}
.process-body{padding:2px 4px 10px 22px}
.process-body pre{margin:4px 0 0;padding:8px 10px;border-radius:var(--radius-sm);background:var(--platform);font:12px/18px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto;color:var(--label-1)}
/* Assistant text flows free. */
.assistant-row{padding:8px 4px 4px}
.prose{white-space:pre-wrap;word-break:break-word}
.truncated-note{margin-top:4px;font:12px/18px var(--font);color:var(--label-3)}
.process-row.failed .process-label,.process-row.failed .process-summary{color:var(--error)}
#follow{position:absolute;right:16px;bottom:16px;z-index:2;border-radius:18px;padding:6px 14px;color:var(--label-1);background:var(--platform);box-shadow:0 4px 16px #0003}
#follow:hover{color:var(--label-1)}
#empty{padding:32px 20px;color:var(--label-3)}
.hidden{display:none!important}
@media (max-width:480px){#stage{padding:0 8px 20px}.bubble{max-width:88%}}
</style>
</head>
<body>
<header><h1 id="title">DSH 执行记录</h1></header>
<nav class="toolbar">
  <select id="fixture" aria-label="选择执行记录">
    <option value="demo-1792663550562.json">演示任务（含命令失败与恢复）</option>
    <option value="ui-check-1792664983899.json">界面小测试（读→写→校验）</option>
    <option value="stress-long.json">长结果记录</option>
  </select>
  <button id="replay" type="button">逐步回放</button>
</nav>
<div id="stage"><div id="panel">
  <div id="ledger" aria-label="执行记录">
    <p id="empty">正在载入记录…</p>
  </div>
  <button id="follow" class="hidden" type="button">回到最新</button>
</div></div>
<script type="module">
import { mountLedger } from './trajectory.mjs';
const forced = new URLSearchParams(location.search).get('theme');
if (forced === 'light' || forced === 'dark') document.documentElement.dataset.theme = forced;
const $ = id => document.getElementById(id);
let all = [];
const ledger = mountLedger($('ledger'), { followButton: $('follow') });
async function load(name) {
  const fixture = await (await fetch(`./fixture/${name}`)).json();
  all = fixture.events;
  $('title').textContent = fixture.label;
  $('empty')?.remove();
  ledger.render(all);
}
let replaying = false;
$('replay').addEventListener('click', async () => {
  if (replaying) return;
  replaying = true;
  $('replay').disabled = true;
  for (let shown = 1; shown <= all.length; shown++) {
    ledger.render(all.slice(0, shown));
    await new Promise(resolve => setTimeout(resolve, 220));
  }
  replaying = false;
  $('replay').disabled = false;
});
$('fixture').addEventListener('change', () => load($('fixture').value));
await load($('fixture').value);
</script>
</body>
</html>
