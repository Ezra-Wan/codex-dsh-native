<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH 执行记录</title>
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./markdown.css">
<style>
/* Component styles copied from upstream sources at 687f282e (MIT):
   header/tabs — packages/client/ui-conversation/src/client/skeleton/ConversationRoot.module.css
   chat view   — packages/client/ui-chat/src/client/chat/MessageItem / TurnProcessNodeView.module.css
   ledger view — packages/client/ui-trajectory/src/client/TrajectoryCell / TrajectoryTurnHeader.module.css
   All colors/radii/fonts ride the copied token sheet in theme.css. */
*{box-sizing:border-box}
body{margin:0;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);font:var(--dsw-font-base-16)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{cursor:default;opacity:.4}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--dsw-alias-state-business-primary);outline-offset:1px;border-radius:var(--dsw-radius-xs)}

/* Header + view tab strip (ConversationRoot .header/.tabs/.tab). */
.app-header{display:grid;min-height:76px;padding:10px 28px 0 20px;border-bottom:0.5px solid var(--dsw-alias-border-l3)}
.title-row{display:flex;align-items:center;min-height:30px}
.title-row h1{font:var(--dsw-font-base-strong-16);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-meta{display:flex;gap:14px;align-items:center;margin-left:16px;min-width:0}
.meta-chip{font:var(--dsw-font-xs-13);color:var(--dsw-alias-label-tertiary);white-space:nowrap}
.tabs{grid-column:1 / -1;position:relative;z-index:1;display:flex;gap:36px;margin-top:10px;padding-left:8px}
.tab{position:relative;padding:0 0 9px;font-size:13px;line-height:16px;font-weight:500;color:var(--dsw-alias-label-tertiary);cursor:pointer}
.tab::after{content:'';position:absolute;right:0;bottom:-1px;left:0;height:2px;border-radius:2px;background:transparent}
.tab:hover{color:var(--dsw-alias-label-secondary)}
.tab.active{color:var(--dsw-alias-state-business-primary)}
.tab.active::after{background:var(--dsw-alias-state-business-primary)}

.toolbar{display:flex;gap:8px;align-items:center;max-width:760px;margin:0 auto;padding:8px 16px 4px}
.toolbar button,.toolbar select{font:var(--dsw-font-xs-13);color:var(--dsw-alias-label-secondary);background:none;border-radius:var(--dsw-radius-sm);padding:4px 10px;cursor:pointer}
.toolbar button:hover,.toolbar select:hover{background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-primary)}

#stage{padding:0 16px 24px}
.view[hidden]{display:none}
.chevron{flex:none;width:14px;height:14px;margin-right:6px;position:relative;transition:transform 100ms ease}
.chevron::after{content:"";position:absolute;left:4px;top:4px;width:5px;height:5px;border-right:1.4px solid currentColor;border-bottom:1.4px solid currentColor;transform:rotate(45deg)}
details[open] > .status-line .chevron,details[open] > summary .chevron{transform:rotate(180deg)}

/* ---------- 对话 view (MessageItem / TurnProcessNodeView) ---------- */
#view-chat{max-width:760px;margin:0 auto;font-size:14px}
.chat-scroll{height:calc(100vh - 186px);min-height:320px;overflow-y:auto;overscroll-behavior:contain}
.chat-scroll > .turn{list-style:none}
.process-list{list-style:none;margin:0;padding:0}
.turn{padding-bottom:6px}
.user-stack{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding:6px 0}
.bubble{max-width:min(calc(760px * 0.702),82%);background:var(--dsw-specific-bubble);border-radius:var(--dsw-radius-xl);padding:10px 16px;font-size:var(--dsh-content-font-size,14px);line-height:calc(22px);color:var(--dsw-alias-label-primary);white-space:pre-wrap;word-break:break-word}
.status-line{display:flex;align-items:center;height:33px;padding:0 0 8px;border-bottom:0.5px solid var(--dsw-alias-border-l2);color:var(--dsw-alias-label-tertiary);cursor:pointer;list-style:none;transition:color 100ms ease}
.status-line svg{transition:transform 100ms ease;margin-left:6px}
.turn-rest[open] > .status-line svg{transform:rotate(180deg)}
.status-line:hover{color:var(--dsw-alias-label-secondary)}
/* ChatGroupSeat group header: activity icon swaps to chevron on hover/expand. */
.group-title{display:flex;align-items:center;gap:6px;max-width:100%;padding:0;color:var(--dsw-alias-label-tertiary);font:inherit;font-size:14px;text-align:left;cursor:pointer;list-style:none;transition:color 100ms ease}
.group-title::-webkit-details-marker{display:none}
.group-title:hover{color:var(--dsw-alias-label-secondary)}
.leading{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;color:inherit}
.activity-icon,.swap-chevron{position:absolute;inset:0;display:inline-flex;align-items:center;justify-content:center;transition:opacity 100ms ease}
.swap-chevron{opacity:0}
.group-title:is(:hover,:focus-visible) .activity-icon,.group-title[aria-expanded="true"] .activity-icon,.turn-rest:not([open]) > .status-line .swap-chevron{opacity:0}
.group-title:is(:hover,:focus-visible) .swap-chevron,.group-title[aria-expanded="true"] .swap-chevron{opacity:1}
.group-body{max-height:min(400px,50vh);overflow-y:auto;padding-top:2px}
.process-list{--flow-gap:6px}
/* Member rows: icon + label + summary, no hairlines, no per-row chevron. */
.process-row{list-style:none}
.row-head{display:flex;align-items:center;min-height:26px;padding:0 4px;gap:8px;color:var(--dsw-alias-label-tertiary);cursor:pointer;list-style:none;transition:color 100ms ease}
.row-head::-webkit-details-marker{display:none}
.row-head:hover{color:var(--dsw-alias-label-secondary);background:var(--dsw-alias-interactive-bg-hover);border-radius:var(--dsw-radius-sm)}
.row-head:focus-visible{outline:2px solid var(--dsw-alias-state-business-primary);outline-offset:1px;border-radius:var(--dsw-radius-sm)}
.row-icon{flex:none;display:inline-flex;width:14px;height:14px;color:inherit}
.row-label{flex:none}
.row-summary{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px}
.row-summary.dotted{text-decoration:underline dotted 1px;text-underline-offset:3px}
.process-body{padding:2px 4px 8px 26px}
.process-body pre,.detail pre{margin:4px 0 0;padding:8px 10px;border-radius:var(--dsw-radius-sm);background:var(--dsw-alias-bg-layer-2);font-family:var(--ds-font-family-code,ui-monospace,Consolas,monospace);font-size:12px;line-height:18px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto;color:var(--dsw-alias-label-primary)}
.assistant-row{padding:10px 4px 4px}
.prose{white-space:pre-wrap;word-break:break-word}
.md-h{font-weight:600;margin:6px 0 2px}
.md-list{margin:2px 0;padding-left:22px}
.md-list li{margin:2px 0}
.md-code{background:var(--dsw-alias-bg-layer-2);border-radius:4px;padding:1px 5px;font-family:var(--ds-font-family-code,ui-monospace,Consolas,monospace);font-size:0.92em}
.md-link{color:var(--dsw-alias-label-primary);text-decoration:underline;text-underline-offset:2px}
.truncated-note{margin-top:4px;font:var(--dsw-font-xs-13);color:var(--dsw-alias-label-tertiary)}
.process-row.failed .row-label,.process-row.failed .row-summary{color:var(--dsw-alias-state-error-primary)}
#chat-follow,#ledger-follow{position:absolute;right:16px;bottom:16px;z-index:2;border-radius:18px;padding:6px 14px;color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-3);border:0.5px solid var(--dsw-alias-border-l3);box-shadow:0 4px 16px #0003}
#empty{padding:32px 20px;color:var(--dsw-alias-label-tertiary)}
.hidden{display:none!important}

/* ---------- 轨迹 view (TrajectoryCell / TrajectoryTurnHeader / Toolbar / Timeline) ---------- */
#view-trajectory{position:relative;max-width:980px;margin:0 auto}
.tj-toolbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:0 6px;height:30px;border-bottom:0.5px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-layer-1)}
.tj-toolbar .actions{display:flex;align-items:center;gap:2px}
.tj-toggle{display:inline-flex;align-items:center;height:20px;padding:0 7px;gap:4px;border:0;border-radius:var(--dsw-radius-sm);color:var(--dsw-alias-label-tertiary);background:transparent;cursor:pointer;font:var(--dsw-font-xxs-12)}
.tj-toggle:hover{color:var(--dsw-alias-label-primary);background:var(--dsw-alias-interactive-bg-hover)}
.tj-toggle[aria-pressed=true]{color:var(--dsw-alias-label-primary);background:var(--dsw-alias-interactive-bg-hover)}
.tj-search{display:flex;flex:0 1 164px;align-items:center;min-width:84px;height:22px;margin-left:auto;padding:0 6px;gap:4px;border:0.5px solid var(--dsw-alias-border-l4);border-radius:var(--dsw-radius-sm);color:var(--dsw-alias-label-caption);background:var(--dsw-alias-bg-layer-2)}
.tj-search:focus-within{border-color:var(--dsw-alias-state-business-primary);background:var(--dsw-alias-bg-layer-1)}
.tj-search input{min-width:0;width:100%;padding:0;border:0;outline:0;color:var(--dsw-alias-label-primary);background:transparent;font:var(--dsw-font-xxs-12)}
.tj-search input::placeholder{color:var(--dsw-alias-label-caption)}
/* Timeline overview (TrajectoryTimeline): 44px gutter + three 14px lanes. */
.timeline{position:relative;z-index:1;border-bottom:0.5px solid var(--dsw-alias-border-l2);user-select:none}
.timeline-plot{display:grid;grid-template-columns:44px minmax(0,1fr);height:50px;overflow:hidden;background:var(--dsw-alias-bg-layer-2)}
.timeline-labels{position:relative;border-right:0.5px solid var(--dsw-alias-border-l1);color:var(--dsw-alias-label-caption);font:var(--dsw-font-xs-13);font-size:10px;line-height:1}
.timeline-labels span{position:absolute;right:3px;display:flex;align-items:center;justify-content:flex-end;height:8px}
.timeline-labels span:nth-child(1){top:7px}
.timeline-labels span:nth-child(2){top:21px}
.timeline-labels span:nth-child(3){top:35px}
.timeline-track{position:relative;overflow:hidden;cursor:crosshair}
.timeline-span{position:absolute;height:8px;border-radius:2px}
.timeline-span[data-timeline-span=user]{background:var(--dsw-alias-state-business-primary)}
.timeline-span[data-timeline-span=context]{background:color-mix(in srgb,var(--dsw-alias-state-success-primary) 68%,var(--dsw-alias-label-secondary))}
.timeline-span[data-timeline-span=message]{background:color-mix(in srgb,var(--dsw-static-deepseek-450) 60%,var(--dsw-alias-state-error-secondary))}
.timeline-span[data-timeline-span=tool]{background:var(--dsw-alias-state-warn-label)}
.timeline-span[data-error=true]{background:var(--dsw-alias-state-error-primary)}
.timeline-span:hover{z-index:1;box-shadow:0 0 0 1px var(--dsw-alias-bg-layer-2),0 0 0 2px color-mix(in srgb,var(--dsw-alias-state-business-primary) 80%,transparent)}
.ledger-scroll{height:calc(100vh - 186px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;border:0.5px solid var(--dsw-alias-border-l4);border-radius:var(--dsw-radius-md);background:var(--dsw-alias-bg-layer-2)}
.ledger-scroll ul{list-style:none;margin:0;padding:0}
.turn-head{position:sticky;top:0;z-index:1;height:44px;background:var(--dsw-alias-button-ghost-active-fill)}
.turn-inner{display:flex;align-items:center;justify-content:space-between;height:100%;max-width:848px;margin:0 auto;padding:0 16px}
.turn-name{font:var(--dsw-font-xs-strong-13);color:var(--dsw-alias-label-primary)}
.turn-badge{font:var(--dsw-font-xs-13);color:var(--dsw-alias-label-secondary);border:0.5px solid var(--dsw-alias-border-l4);border-radius:var(--dsw-radius-xs);padding:1px 6px}
.records{padding:8px 16px 12px}
.record details{border-radius:var(--dsw-radius-md);border:0.5px solid var(--dsw-alias-border-l4);background:var(--dsw-alias-bg-layer-3);margin-bottom:6px}
.record[data-state=error] details,.record[data-state=interrupted] details{border-color:color-mix(in srgb,var(--dsw-alias-state-error-secondary) 35%,transparent)}
.record summary{list-style:none;display:flex;align-items:center;height:38px;padding:0 8px 0 12px;gap:12px;cursor:pointer;min-width:0}
.record summary::-webkit-details-marker{display:none}
.idx{flex:none;width:24px;font:var(--dsw-font-xs-13);color:var(--dsw-alias-label-tertiary)}
.tag{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 4px;border-radius:var(--dsw-radius-xs);font:var(--dsw-font-xs-strong-13);white-space:nowrap}
.tagUser{color:var(--dsw-alias-state-success-primary);background:var(--dsw-alias-state-success-tertiary)}
.tagContext{color:color-mix(in srgb,var(--dsw-alias-state-success-primary) 68%,var(--dsw-alias-label-secondary));background:var(--dsw-alias-state-success-tertiary)}
.tagMessage{color:color-mix(in srgb,var(--dsw-static-deepseek-450) 60%,var(--dsw-alias-state-error-secondary));background:color-mix(in srgb,color-mix(in srgb,var(--dsw-static-deepseek-450) 55%,var(--dsw-alias-state-error-secondary)) 15%,var(--dsw-alias-bg-layer-1))}
.tagTool{color:var(--dsw-alias-state-warn-label);background:var(--dsw-alias-state-warn-tertiary)}
.tagError{color:var(--dsw-alias-state-error-primary);background:color-mix(in srgb,var(--dsw-alias-state-error-secondary) 15%,var(--dsw-alias-bg-layer-1))}
.cell-text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:var(--dsw-font-xs-13);color:var(--dsw-alias-label-primary)}
.trailing{flex:none;margin-left:auto;display:flex;align-items:center}
.metric{width:64px;font:var(--dsw-font-xs-13);color:var(--dsw-alias-label-tertiary);white-space:nowrap;text-align:left}
#view-trajectory[data-metric] .metric{display:none}
#view-trajectory[data-metric=duration] .metric[data-metric=duration]{display:inline}
#view-trajectory[data-metric=turn] .metric[data-metric=turn]{display:inline}
#view-trajectory[data-metric=call] .metric[data-metric=call]{display:inline}
.time{width:64px;font:var(--dsw-font-xs-13);color:var(--dsw-alias-label-tertiary);white-space:nowrap}
.detail{padding:2px 12px 10px 56px}
.detail pre{margin:6px 0 0;padding:8px 10px;border-radius:var(--dsw-radius-sm);background:var(--dsw-alias-bg-layer-2);font-family:var(--ds-font-family-code,ui-monospace,Consolas,monospace);font-size:12px;line-height:18px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto;color:var(--dsw-alias-label-primary)}
.record[data-state=error] .detail pre,.record[data-state=interrupted] .detail pre{background:color-mix(in srgb,var(--dsw-alias-state-error-secondary) 8%,var(--dsw-alias-bg-layer-3))}
@media (max-width:480px){#stage{padding:0 8px 20px}.records{padding:6px 8px 10px}.record summary{gap:8px;padding-left:8px}.idx{display:none}.detail{padding-left:12px}.bubble{max-width:88%}}
</style>
</head>
<body>
<header class="app-header">
  <div class="title-row">
    <h1 id="title">DSH 执行记录</h1>
    <div class="header-meta" id="header-meta"></div>
  </div>
  <nav class="tabs">
    <button class="tab active" id="tab-chat" type="button">对话</button>
    <button class="tab" id="tab-trajectory" type="button">轨迹</button>
  </nav>
</header>
<nav class="toolbar">
  <select id="fixture" aria-label="选择执行记录">
    <option value="demo-1792663550562.json">演示任务（含命令失败与恢复）</option>
    <option value="ui-check-1792664983899.json">界面小测试（读→写→校验）</option>
    <option value="stress-long.json">长结果记录</option>
  </select>
  <button id="replay" type="button">逐步回放</button>
</nav>
<div id="stage">
  <div class="view" id="view-chat">
    <div class="chat-scroll" id="chat-ledger" aria-label="对话记录">
      <p id="empty">正在载入记录…</p>
    </div>
    <button id="chat-follow" class="hidden" type="button">回到最新</button>
  </div>
  <div class="view" id="view-trajectory" hidden data-metric="duration">
    <div class="tj-toolbar">
      <span class="actions" role="group" aria-label="尾列显示">
        <button class="tj-toggle" type="button" data-metric-toggle="duration" aria-pressed="true">时长</button>
        <button class="tj-toggle" type="button" data-metric-toggle="turn" aria-pressed="false">轮次</button>
        <button class="tj-toggle" type="button" data-metric-toggle="call" aria-pressed="false">调用</button>
      </span>
      <label class="tj-search"><input id="tj-search" type="search" placeholder="搜索" aria-label="搜索轨迹"></label>
    </div>
    <div class="ledger-scroll" id="trajectory-ledger" aria-label="执行轨迹"></div>
    <button id="ledger-follow" class="hidden" type="button">回到最新</button>
  </div>
</div>
<script type="module">
import { mountLedger } from './trajectory.mjs';
import { mountLedger as mountLedgerGrid } from './ledger-view.mjs';
const forced = new URLSearchParams(location.search).get('theme');
if (forced === 'light' || forced === 'dark') document.documentElement.dataset.theme = forced;
const $ = id => document.getElementById(id);
let all = [];
const chat = mountLedger($('chat-ledger'), { followButton: $('chat-follow') });
const grid = mountLedgerGrid($('trajectory-ledger'), { followButton: $('ledger-follow') });
async function load(name) {
  const fixture = await (await fetch(`./fixture/${name}`)).json();
  all = fixture.events;
  $('title').textContent = fixture.meta?.name || fixture.label;
  const meta = $('header-meta');
  meta.replaceChildren();
  if (fixture.meta?.mode) { const el = document.createElement('span'); el.className = 'meta-chip'; el.textContent = fixture.meta.mode; meta.append(el); }
  if (fixture.meta?.permission) { const el = document.createElement('span'); el.className = 'meta-chip'; el.textContent = fixture.meta.permission; meta.append(el); }
  $('empty')?.remove();
  chat.render(all);
  grid.render(all);
}
let replaying = false;
$('replay').addEventListener('click', async () => {
  if (replaying) return;
  replaying = true;
  $('replay').disabled = true;
  for (let shown = 1; shown <= all.length; shown++) {
    chat.render(all.slice(0, shown));
    grid.render(all.slice(0, shown));
    await new Promise(resolve => setTimeout(resolve, 220));
  }
  replaying = false;
  $('replay').disabled = false;
});
$('fixture').addEventListener('change', () => load($('fixture').value));
const tabs = [['tab-chat', 'view-chat'], ['tab-trajectory', 'view-trajectory']];
for (const [tabId, viewId] of tabs) {
  $(tabId).addEventListener('click', () => {
    for (const [t, v] of tabs) {
      $(t).classList.toggle('active', t === tabId);
      $(v).hidden = v !== viewId;
    }
  });
}
// 轨迹签工具栏：尾列模式切换（时长/轮次/调用）与文本过滤。
const trajectoryView = $('view-trajectory');
for (const button of trajectoryView.querySelectorAll('[data-metric-toggle]')) {
  button.addEventListener('click', () => {
    trajectoryView.dataset.metric = button.dataset.metricToggle;
    for (const other of trajectoryView.querySelectorAll('[data-metric-toggle]')) {
      other.setAttribute('aria-pressed', String(other === button));
    }
  });
}
$('tj-search').addEventListener('input', event => {
  const query = event.target.value.trim().toLowerCase();
  for (const row of trajectoryView.querySelectorAll('.record')) {
    row.hidden = query !== '' && !(row.dataset.search ?? '').includes(query);
  }
});
await load($('fixture').value);
</script>
</body>
</html>
