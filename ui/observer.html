<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>__THEME__</style>
<style>
*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;height:100vh;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);font:var(--dsw-font-s-14)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:0.5px solid var(--dsw-alias-border-l2);flex:none}
header h1{font:var(--dsw-font-xs-strong-13);margin:0;flex:none}
select{font:var(--dsw-font-xs-13);color:var(--dsw-alias-label-secondary);background:var(--dsw-alias-bg-layer-2);border:0.5px solid var(--dsw-alias-border-l4);border-radius:var(--dsw-radius-sm);padding:3px 8px;max-width:220px}
.badge{font:var(--dsw-font-xxs-12);color:var(--dsw-alias-label-tertiary);white-space:nowrap}
a{color:var(--dsw-alias-link);font:var(--dsw-font-xxs-12);text-decoration:none;margin-left:auto;flex:none}
a:hover{text-decoration:underline dotted}
#notice{display:none;padding:6px 14px;font:var(--dsw-font-xxs-12);color:var(--dsw-alias-state-warn-label);background:var(--dsw-alias-state-warn-tertiary);border-bottom:0.5px solid var(--dsw-alias-border-l2);flex:none}
#frame{flex:1;width:100%;border:0;background:var(--dsw-alias-bg-base)}
#fallback{flex:1;overflow:auto;padding:16px;display:none}
.row{display:flex;align-items:baseline;gap:10px;padding:8px 2px;border-bottom:0.5px solid var(--dsw-alias-border-l2);font:var(--dsw-font-xs-13)}
.row .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .state{margin-left:auto;color:var(--dsw-alias-label-tertiary);white-space:nowrap}
.hint{font:var(--dsw-font-xxs-12);color:var(--dsw-alias-label-tertiary);margin:10px 0 4px}
</style></head><body>
<header>
  <h1>DSH 执行记录 · 官方界面</h1>
  <select id="tasks" aria-label="选择桥接任务"><option>读取中…</option></select>
  <span class="badge" id="state"></span>
  <a id="open" href="#" target="_blank" rel="noopener">新窗口打开</a>
</header>
<div id="notice"></div>
<iframe id="frame" title="DSH 官方界面" aria-label="DSH 官方界面" style="display:none"></iframe>
<div id="fallback" aria-label="任务状态" style="display:block"><p class="hint">正在连接官方界面…</p><div id="rows"></div></div>
<script type="module">__APP_CODE__</script></body></html>
