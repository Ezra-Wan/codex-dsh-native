<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--bg:var(--color-background-primary,#fff);--ink:var(--color-text-primary,#202124);--muted:var(--color-text-secondary,#737373);--line:var(--color-border-primary,#dededb);--soft:var(--color-background-secondary,#f5f5f2);--warn:#a34d0b;--warn-bg:#fff2db;--space:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-sans,system-ui,sans-serif)}main{max-width:900px;padding:18px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted)}h1{font-size:18px;margin:4px 0 6px;font-weight:650}p{margin:6px 0}.muted{color:var(--muted);font-size:12px}.badge{font-size:12px;white-space:nowrap;padding:3px 8px;border:1px solid var(--line);border-radius:5px}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}button,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px}button{padding:5px 10px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{cursor:default;opacity:.45}button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #497eaa;outline-offset:2px}select{max-width:100%;min-width:100px;flex:1;padding:5px}label{font-size:12px;display:flex;align-items:center;gap:4px}.warning{padding:10px 12px;margin:12px 0;border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--warn);font-size:13px}.error{color:#b52a2a;white-space:pre-wrap}.timeline{list-style:none;margin:0;padding:0}.event{border-bottom:1px solid var(--line);padding:10px 0}.event summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}.event .time{font:11px/1.4 ui-monospace,monospace;color:var(--muted);flex-shrink:0}.event .label{font-weight:550;overflow-wrap:anywhere}.event .kind{color:var(--muted);font-size:12px;margin-left:auto;flex-shrink:0}.event.failed{border-left:3px solid var(--warn);padding-left:9px}.event.failed .label{color:var(--warn)}pre{background:var(--soft);padding:10px;border-radius:4px;margin:10px 0 2px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,monospace;max-height:300px;overflow:auto}.message{white-space:pre-wrap;margin-top:8px;overflow-wrap:anywhere}#empty{padding:28px 0;color:var(--muted)}footer{margin-top:14px;font-size:11px;color:var(--muted)}.follow{padding-top:12px}textarea{display:block;width:100%;min-height:66px;padding:8px;resize:vertical;margin:8px 0}.controls{display:flex;gap:8px;align-items:center}#more{margin-top:12px}.hidden{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:var(--color-background-primary,#202124);--ink:var(--color-text-primary,#eee);--muted:var(--color-text-secondary,#aaa);--line:var(--color-border-primary,#484848);--soft:var(--color-background-secondary,#2b2c2d);--warn:#f2bd73;--warn-bg:#342a1c}}@media(max-width:400px){main{padding:12px}h1{font-size:16px}nav{gap:6px}.event summary{gap:6px}.event .time{font-size:10px}}
</style></head><body><main>
<header><div><div class="eyebrow">DEEPSEEK HARNESS · 执行记录</div><h1 id="title">连接会话</h1><p id="subtitle" class="muted">读取原生工具事件</p></div><span class="badge" id="status">连接中</span></header>
<nav><select id="tasks" aria-label="选择桥接任务"><option>正在连接</option></select><button id="refresh">刷新</button><label><input id="auto" type="checkbox" checked>自动更新</label><button id="stop" disabled>停止任务</button></nav>
<div id="warning" class="warning hidden" role="status"></div><p id="error" class="error" role="alert"></p>
<p id="empty">等待宿主连接…</p><ol id="events" class="timeline" aria-label="原生执行事件"></ol>
<button id="more" class="hidden">继续读取记录</button>
<details class="follow"><summary>继续这个会话</summary><textarea id="prompt" aria-label="后续任务" placeholder="任务结束后，可在同一个 DSH 会话中继续。"></textarea><div class="controls"><button id="send" disabled>发送后续任务</button><span class="muted">运行中暂不支持插入指令</span></div></details>
<footer id="source">事件来自 DSH 原生日志；查看与刷新不会调用模型。</footer>
</main><script type="module">__APP_CODE__</script></body></html>
