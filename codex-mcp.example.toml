# Optional bridge. Keep the underlying runtime off until ds_bridge(enabled=true).
# env_vars forwards a variable; it does not store its secret value here.
[mcp_servers.dsh_native_p0]
command = 'D:\nodejs\node.exe'
args = ['D:\@harness\codex-dsh-native-p0\src\server.mjs']
env_vars = ['DEEPSEEK_API_KEY']
startup_timeout_sec = 20
tool_timeout_sec = 65
enabled = true

[mcp_servers.dsh_native_p0.env]
# Legacy 8792 replay must not start merely because Codex loads this MCP.
DSH_NATIVE_REPLAY = "off"
# Verified native frontend over MCP, avoiding blocked loopback iframes.
CODEX_DSH_UI = "mcp"
# Worker defaults to deepseek_worker in this Codex home's config.toml.
# An isolated Codex home can set CODEX_DSH_WORKER_CONFIG to the retained
# worker's original config path; do not duplicate its installation/credentials.
